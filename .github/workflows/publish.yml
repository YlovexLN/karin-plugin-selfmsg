# 发布到 GitHub Packages（npm.pkg.github.com）
#
# - 推 v* 开头的 tag 即发布；也可以在 Actions 页面手动触发
# - 发布前先校验 tag 与 package.json 的 version 一致，再跑冒烟测试
# - 凭据用仓库自带的 GITHUB_TOKEN，不需要额外 secret
# - 包名必须是 `@<仓库所有者>/...`，换所有者时同步 package.json 的 name
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      # tag 打错会导致版本号与代码不符，而 npm 不允许重发同版本
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${VER} 不一致"
            exit 1
          fi

      - name: 冒烟测试
        run: node scripts/test.mjs

      - name: 发布
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
