# 发布到 GitHub Packages（npm.pkg.github.com）
#
# - 打 Release 时自动发布，也可以在 Actions 页面手动触发
# - 版本号取自 package.json，发布前先跑冒烟测试
# - 凭据用仓库自带的 GITHUB_TOKEN，不需要额外 secret
# - 包名必须是 `@<仓库所有者>/...`，换所有者时同步 package.json 的 name
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: 冒烟测试
        run: node scripts/test.mjs

      - name: 发布
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
