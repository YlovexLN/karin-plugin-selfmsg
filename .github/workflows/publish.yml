# 双源发布：npmjs.com（无 scope）+ GitHub Packages（scoped）
#
# 拆成两个 job，原因是权限必须隔离：
#   npmjs job       需要 id-token: write（Trusted Publishing 走 OIDC）
#   GitHub Packages job 绝对不能有 id-token
#     —— 有的话 npm 11 会先尝试 OIDC 换凭据，POST 到 GitHub 的
#        /-/npm/v1/oidc/token/exchange 得到 404，然后直接 ENEEDAUTH，
#        也不会回退到 NODE_AUTH_TOKEN。
#
# 其余规则：
# - 推 v* tag 即发布；也可以手动触发
# - 校验 tag 与 package.json 的 version 一致 → 冒烟测试 → 推导 dist-tag
# - 发布前查该版本是否已存在，重跑自动跳过
# - 预发布版本（带 -）发到 beta/rc 等 dist-tag，不占 latest
# - 包名分两个：GitHub Packages 强制 `@owner/` 前缀，发布前用 npm pkg set 临时改
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npmjs:
    name: 发布到 npmjs.com
    runs-on: ubuntu-latest
    if: github.repository == 'YlovexLN/karin-plugin-selfmsg'
    permissions:
      contents: read
      id-token: write # Trusted Publishing 必需
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing 要求 npm >= 11.5，node 24 自带 npm 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 确认 npm 版本支持 OIDC
        run: |
          VER="$(npm --version)"
          echo "npm $VER"
          if [ "$(printf '%s\n' 11.5.0 "$VER" | sort -V | head -n1)" != "11.5.0" ]; then
            echo "::error::npm $VER 低于 11.5.0，不支持 Trusted Publishing"
            exit 1
          fi

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${VER} 不一致"
            exit 1
          fi

      - name: 冒烟测试
        run: node scripts/test.mjs

      # 幂等：已发布就跳过，重跑同一 tag 不会红在 E403
      - name: 检查 npmjs 上是否已存在
        id: state
        run: |
          VER="$(node -p "require('./package.json').version")"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/karin-plugin-selfmsg/$VER")
          case "$CODE" in
            200) echo "needed=false" >> "$GITHUB_OUTPUT"; echo "已存在，跳过" ;;
            404) echo "needed=true"  >> "$GITHUB_OUTPUT"; echo "未发布" ;;
            *) echo "::error::npmjs 状态查询失败（HTTP $CODE）"; exit 1 ;;
          esac

      # 剥离开发字段，让 npm 上的 manifest 只留运行时信息
      - name: 清理 manifest
        run: |
          npm pkg delete devDependencies
          npm pkg delete scripts

      - name: 推导 dist-tag
        id: dist
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in
            *-*) DIST_TAG="${VER#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "value=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER dist-tag=$DIST_TAG"

      # OIDC：不带 NODE_AUTH_TOKEN，provenance 由 npm 自动生成
      - name: 发布
        if: steps.state.outputs.needed == 'true'
        run: |
          npm pkg set name="karin-plugin-selfmsg"
          npm publish --registry=https://registry.npmjs.org \
            --tag "${{ steps.dist.outputs.value }}"

  github-packages:
    name: 发布到 GitHub Packages
    runs-on: ubuntu-latest
    needs: [npmjs]
    if: github.repository == 'YlovexLN/karin-plugin-selfmsg'
    permissions:
      contents: read
      packages: write
      # 刻意不给 id-token：给了 npm 会走 OIDC 并失败，见文件顶部说明
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$VER" ] || { echo "::error::tag $TAG 与版本 $VER 不一致"; exit 1; }
          echo "version=$VER"

      # GitHub Packages 对不存在的包返回 401（不是 404），按未发布处理
      - name: 检查 GitHub Packages 上是否已存在
        id: state
        run: |
          VER="$(node -p "require('./package.json').version")"
          CODE=$(curl -s -o /tmp/gh-pkg.json -w '%{http_code}' \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            -H "Accept: application/vnd.npm.install-v1+json" \
            "https://npm.pkg.github.com/@ylovexln%2Fkarin-plugin-selfmsg")
          case "$CODE" in
            200)
              if node -e "const p=require('/tmp/gh-pkg.json');process.exit(p.versions&&p.versions['$VER']?0:1)"; then
                echo "needed=false" >> "$GITHUB_OUTPUT"; echo "已存在，跳过"
              else
                echo "needed=true" >> "$GITHUB_OUTPUT"; echo "未发布"
              fi
              ;;
            404|401|403)
              echo "needed=true" >> "$GITHUB_OUTPUT"; echo "未发布（HTTP $CODE）"
              ;;
            *) echo "::error::GitHub Packages 状态查询失败（HTTP $CODE）"; exit 1 ;;
          esac

      - name: 清理 manifest
        run: |
          npm pkg delete devDependencies
          npm pkg delete scripts

      - name: 推导 dist-tag
        id: dist
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in
            *-*) DIST_TAG="${VER#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "value=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG"

      - name: 发布
        if: steps.state.outputs.needed == 'true'
        run: |
          npm pkg set name="@ylovexln/karin-plugin-selfmsg"
          # setup-node 只写了默认源的映射，GitHub Packages 需要自己补一行
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
          npm publish --registry=https://npm.pkg.github.com \
            --tag "${{ steps.dist.outputs.value }}" --loglevel=http
